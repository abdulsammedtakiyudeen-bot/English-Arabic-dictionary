<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12372a">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password | Islamic Arabic Learning Dictionary</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./index.html">بِ Arabic Learning</a>
    <a href="./login.html">Log in</a>
  </header>
  <main>
    <section class="card">
      <p class="bismillah" lang="ar" dir="rtl">أَهْلًا وَسَهْلًا</p>
      <h1>Choose a new password</h1>
      <p class="intro">After opening the password-reset email, enter a new password for your account below.</p>
      <form id="passwordForm">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button id="submitBtn" type="submit">Update password</button>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <p class="links"><a href="./login.html">Return to login</a></p>
    </section>
  </main>
  <footer>Islamic Arabic Learning Dictionary · Dev. Takiyudeen</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./reset-password.js"></script>
</body>
</html>
