<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12372a">
  <meta name="description" content="Manage your account and membership.">
  <title>My Profile | Islamic Arabic Learning Dictionary</title>
  <link rel="stylesheet" href="./profile.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script><script src="./auth-gate.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./learn.html">
    <span class="brand-mark">بِ</span>
    <span><strong>Arabic Learning</strong><small>Islamic Arabic Learning Dictionary</small></span>
  </a>
  <a class="back-link" href="./learn.html">← Back to learning</a>
</header><main class="wrap">
  <section class="profile-card">
    <div class="avatar" aria-hidden="true">👤</div>
    <p class="eyebrow">YOUR ACCOUNT</p>
    <h1>My Profile</h1>
    <p class="muted">Manage your account and membership.</p><div id="status" class="status" role="status" aria-live="polite">
  Checking your account…
</div>

<div id="profileDetails" class="details" hidden></div>

<section id="membershipCard" class="membership-card" hidden>
  <p class="eyebrow">MEMBERSHIP</p>
  <h2 id="membershipTitle">Checking membership…</h2>
  <p id="membershipMessage" class="muted"></p>
  <p id="expiryDetails" class="small" hidden></p>
  <a id="premiumLink" class="primary premium-link" href="./premium.html">
    View Premium Plans
  </a>
</section>

<form id="editForm" hidden>
  <h2>Account Settings</h2>
  <label for="displayName">Display name</label>
  <input id="displayName" maxlength="80" autocomplete="name" placeholder="Enter your name">
  <button class="primary" type="submit">Save Name</button>
</form>

<div class="actions">
  <a id="loginLink" class="primary" href="./login.html">Log In</a>
  <a id="signupLink" class="secondary" href="./signup.html">Create Account</a>
  <button id="logoutBtn" class="danger" type="button" hidden>Log Out</button>
</div>

  </section>
</main><nav class="bottom-nav" aria-label="Main navigation">
